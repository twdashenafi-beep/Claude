# Publishes to GitHub Pages:
#   /                DayFlow, built from source as an installable web app
#   /privacy.html    privacy policy   (required App Store metadata)
#   /support.html    support page     (required App Store metadata)
#   /terms.html      terms of use
#   /world-monitor/  the static dashboard from the repo root
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# If a run is blocked with a deployment-protection error, allow this branch
# under Settings -> Environments -> github-pages -> Deployment branches.
name: Deploy Pages

on:
  push:
    branches:
      - claude/plw-vpvdd9
      - claude/finalize-app-build-qjasx3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dayflow/package-lock.json

      - name: Install DayFlow dependencies
        working-directory: dayflow
        run: npm ci

      # Without this the only place the omission shows up is a grey line at the
      # bottom of the app, on a phone, after a deploy. Secrets are never echoed —
      # only whether they arrived.
      - name: Check Supabase configuration
        run: |
          state() { [ -n "$1" ] && echo present || echo MISSING; }
          echo "As secrets (what the build uses):"
          echo "  EXPO_PUBLIC_SUPABASE_URL:      $(state "$SEC_URL")"
          echo "  EXPO_PUBLIC_SUPABASE_ANON_KEY: $(state "$SEC_KEY")"
          echo "As variables (a common mix-up — same page, different tab):"
          echo "  EXPO_PUBLIC_SUPABASE_URL:      $(state "$VAR_URL")"
          echo "  EXPO_PUBLIC_SUPABASE_ANON_KEY: $(state "$VAR_KEY")"
          echo "Near-miss names, in case of a typo:"
          echo "  SUPABASE_URL:                  $(state "$ALT_URL")"
          echo "  SUPABASE_ANON_KEY:             $(state "$ALT_KEY")"
          echo "  EXPO_PUBLIC_SUPABASE_KEY:      $(state "$ALT_KEY2")"

          if [ -n "$SEC_URL" ] && [ -n "$SEC_KEY" ]; then
            echo "Cloud sync will be enabled in this build."
          elif [ -n "$VAR_URL" ] || [ -n "$VAR_KEY" ]; then
            echo "::warning title=Values are variables, not secrets::Found under the Variables tab. The build reads secrets. Re-add them on the Secrets tab of the same page and re-run."
          elif [ -n "$ALT_URL" ] || [ -n "$ALT_KEY" ] || [ -n "$ALT_KEY2" ]; then
            echo "::warning title=Secret names do not match::Something similar exists but the names must be exactly EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY."
          else
            echo "::warning title=Cloud sync disabled::No Supabase secrets or variables reached this build, so it is local-only. Check they were added to this repository (Settings > Secrets and variables > Actions > Secrets tab), not to your account or an environment."
          fi
        env:
          SEC_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SEC_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          VAR_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          VAR_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ALT_URL: ${{ secrets.SUPABASE_URL }}
          ALT_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALT_KEY2: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}

      - name: Build DayFlow web app
        working-directory: dayflow
        # Pages serves this repo under /Claude/, so the bundle needs that base.
        # The Supabase values are EXPO_PUBLIC_* and are inlined into the bundle
        # by design — the anon key is meant to be public, and Row Level Security
        # plus client-side encryption are what actually protect the data. They
        # come from repository secrets only so they are easy to rotate.
        run: npm run build:pages
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Assemble site
        run: |
          mkdir -p _site/world-monitor
          cp -r dayflow/web-build/. _site/
          cp index.html _site/world-monitor/index.html
          # Privacy, support and terms. App Store Connect requires reachable
          # public URLs for the first two before a submission is accepted.
          cp pages/*.html pages/*.css _site/
          # Pages runs the output through Jekyll otherwise, which strips
          # directories beginning with an underscore — including _expo.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
