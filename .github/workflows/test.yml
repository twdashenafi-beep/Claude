# Checks a pull request before it is merged.
#
# Merging into the deploy branch publishes the site straight away, and until
# this existed nothing ran the tests on the way there: npm test ran only inside
# the TestFlight build, so a change that broke them was found at build time —
# after it was already live on the web.
#
# Two things, both quick (about half a minute together):
#
#   npm test             the unit suites, including native-readiness
#   npm run build:pages  the same web build Pages makes, so a change that
#                        cannot bundle is a red cross here, not a failed deploy
#
# The e2e suite is not here. It needs Playwright and a browser installed on the
# runner, which is a separate decision from this one.

name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run worthless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dayflow/package-lock.json

      - name: Install DayFlow dependencies
        working-directory: dayflow
        run: npm ci

      - name: Unit tests
        working-directory: dayflow
        run: npm test

      # No Supabase values: the app asks for them per device when they are
      # absent, so the build is complete without them, and a pull request from
      # anywhere has no business near the secrets.
      - name: Web build
        working-directory: dayflow
        run: npm run build:pages
